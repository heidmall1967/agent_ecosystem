[[week.quiz]]
q = "Applying temperature T < 1 (logits / T) makes the distribution:"
options = ["Flatter", "Sharper (more peaked)", "Uniform", "Unchanged"]
answer = 1
why = "Dividing by T < 1 widens gaps between logits, so softmax concentrates mass on the top tokens."
[[week.quiz]]
q = "Top-p = 0.9 means sampling from:"
options = ["The 90 most likely tokens", "The smallest set of tokens whose cumulative probability >= 0.9", "Tokens with probability >= 0.9", "A random 90% of the vocabulary"]
answer = 1
why = "Nucleus sampling adapts the candidate set size to how confident the model is."
[[week.quiz]]
q = "Your greedy loop diverges from `generate(do_sample=False)`. Most likely cause:"
options = ["CPU vs GPU", "The model is random at temperature 0", "Prompt formatting (chat template) or generation_config defaults such as repetition_penalty differ", "Python version"]
answer = 2
why = "`generate()` silently applies the model's generation_config; check it and apply the same chat template."
[[week.quiz]]
q = "Constrained decoding (`format` with a JSON schema) guarantees:"
options = ["Correct content", "Schema-shaped, parseable output, but not correct content", "No hallucinations", "Faster generation"]
answer = 1
why = "Shape is guaranteed; semantics (e.g. confidence matches reality, sources exist) still need validation."

