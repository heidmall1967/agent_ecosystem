[[week.quiz]]
q = "Why does RRF fuse ranks instead of raw scores?"
options = ["Ranks are faster to sort", "BM25 scores and cosine similarities are on incomparable scales; ranks need no normalization", "Scores are always negative", "It is required for BM25"]
answer = 1
why = "Score normalization is fragile and query-dependent; rank fusion sidesteps it."
[[week.quiz]]
q = "k=60. Doc A is rank 1 in one list only; doc B is rank 10 in both lists. Which scores higher?"
options = ["A (1/61 = 0.0164)", "B (2/70 = 0.0286)", "Tie", "Cannot tell"]
answer = 1
why = "RRF rewards agreement between retrievers; large k flattens the bonus for being first."
[[week.quiz]]
q = "Dense retrieval tends to miss 'error code E-4012' because:"
options = ["Embeddings are too long", "Embeddings capture meaning, not exact string identity; rare identifiers get fragmented by the tokenizer", "Cosine similarity cannot handle digits", "The model is too small"]
answer = 1
why = "This is exactly the gap BM25 fills: exact rare tokens get high IDF."
[[week.quiz]]
q = "For ~5k chunks on a laptop, a sensible vector store is:"
options = ["A managed vector DB", "A numpy matrix with brute-force cosine", "A graph database", "Elasticsearch cluster"]
answer = 1
why = "5k x 384 floats is ~7.5 MB; a matrix multiply takes milliseconds. Add infrastructure when numbers demand it."

