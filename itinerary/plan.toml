options = ["128 MiB", "512 MiB", "1 GiB", "4 GiB"]
answer = 2
why = "128 KiB x 8192 = 1 GiB. Concurrency multiplies this: 20 users at 8k = 20 GiB of KV alone."
[[week.quiz]]
q = "Single-stream decoding is memory-bandwidth bound because:"
options = ["The GPU is too slow", "Every token requires reading all weights while doing few FLOPs per byte", "The KV cache is on disk", "Tokenization is slow"]
answer = 1
why = "Low arithmetic intensity. Batching raises FLOPs per byte read, which is why throughput rises with batch size."
[[week.quiz]]
