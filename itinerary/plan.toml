why = "`notifications/cancelled` is an example; replying to a notification is a protocol bug."
[[week.quiz]]
q = "Why must an MCP stdio server never print logs to stdout?"
options = ["It is slow", "stdout is the protocol channel; stray output corrupts the message stream", "The spec forbids logging", "stdout is buffered"]
answer = 1
why = "Log to stderr. A single stray print breaks the client's JSON parser."
[[week.quiz]]
q = "Under MCP 2026-07-28, how does a client learn a server's protocol versions and capabilities?"
options = ["A mandatory initialize handshake", "Optionally via `server/discover`; every request also carries its protocol version and client capabilities in `_meta`", "GET /capabilities", "From the Mcp-Session-Id header"]
answer = 1
why = "2026-07-28 made MCP stateless and removed initialize. Older servers still use it, so `server/discover` doubles as a compatibility probe."
[[week.quiz]]
q = "Safest way to implement the calculator tool:"
options = ["eval() with empty globals", "Parse with `ast` and allow only number literals and arithmetic operator nodes", "exec() in a thread", "Regex-check then eval()"]
answer = 1
why = "Restricted eval is escapable via attribute chains; an AST allow-list cannot execute anything you did not permit."

