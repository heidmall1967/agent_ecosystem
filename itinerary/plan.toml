# Running itinerary: edit progress fields, then rebuild:
#   uv run python itinerary/build.py
#
# Per week, update:  status = "todo" | "in-progress" | "done"
#                    hours  = hours actually spent
#                    quiz_score = "3/4"     completed = "2026-10-04"
#                    notes  = "anything worth remembering"
# Mark a task done by prefixing it with "[x] ".
# Quiz answers are indices into options (0 = A). The answer key prints at the end of the PDF.

title = "AI Architect Learning Path: Running Itinerary"
start_date = 2026-09-28   # Monday of week 1
hours_per_week = 15

week_rhythm = [
  "Session 1 (2h): reading + quiz without notes",
  "Sessions 2-4 (10h): build from scratch, then compare against the library/tool",
  "Session 5 (3h): run eval harness, fill measured table, write ADR + client note, answer discussion questions",
]

# ─────────────────────────────── PHASE 0 ───────────────────────────────
[[week]]
n = 1
phase = "Phase 0: Setup & Baseline"
title = "Measurement baseline"
levels = "Setup"
status = "in-progress"
hours = 0
quiz_score = ""
completed = ""
notes = ""
goals = [
  "Working environment: uv, Ollama, eval harness",
  "Your own corpus chosen and checked in",
  "A 40-question golden set and a baseline number on the board",
]
reading = [
  "Hamel Husain: 'Your AI Product Needs Evals' (hamel.dev, 2024)",
  "Ollama API docs: /api/chat and the options object",
]
tasks = [
  "[x] Repo, uv project, eval harness, baseline pipeline",
  "[x] Corpus: MCP spec 2026-07-28 + Ollama docs (65 files, see corpus/SOURCES.txt)",
  "Write 40 golden questions: >=13 identifier, >=20 concept, >=3 multi-hop; keep `uv run python -m eval.check_golden` clean",
  "Run the full baseline: `uv run python -m eval.harness baseline`",
  "Write ADR-0001: corpus choice and eval method (including its weaknesses)",
]
assignment = "Golden set v1 + baseline report."
acceptance = [
  "40 valid rows in `eval/golden.jsonl`; every `sources` file exists in `corpus/`",
  "Baseline summary pasted into ADR-0001",
  "ADR-0001 names two ways keyword scoring can be wrong",
]
questions = [
  "A client says 'we will evaluate by vibes in UAT'. Write your 3-sentence pushback and the minimum eval you would propose instead.",
  "SMEs can give you 2 hours total. How do you get a useful golden set out of them?",
]
[[week.quiz]]
q = "Why build the eval set before writing any retrieval code?"
options = ["Ollama requires it", "Without a fixed measure you cannot tell whether a change helped", "It speeds up inference", "It makes the model deterministic"]
answer = 1
why = "Every later level is a claimed improvement; the golden set is what turns a claim into a number."
[[week.quiz]]
q = "The baseline scored 0/5 on questions about the blueprint. The main reason:"
options = ["Temperature 0", "The model never saw the document, so it guessed (hallucinated)", "The scorer is case-sensitive", "num_ctx 2048 is too small"]
answer = 1
why = "The scorer lowercases both sides. The answers were confident fabrications: exactly the failure RAG exists to fix."
[[week.quiz]]
q = "A weakness of keyword-match scoring:"
options = ["It is slow", "A correct paraphrase can fail and a wrong answer containing the keyword can pass", "It needs a GPU", "It cannot read JSONL"]
answer = 1
why = "Keyword match is cheap and deterministic but measures surface form; week 7 adds an LLM judge to cover meaning."
[[week.quiz]]
q = "Temperature 0 in eval runs mainly serves to:"
options = ["Eliminate hallucinations", "Make runs (near-)reproducible so score changes reflect pipeline changes", "Speed up generation", "Reduce RAM use"]
answer = 1
why = "Greedy decoding removes sampling noise. It is not perfectly deterministic (float/batching effects) and does nothing for factuality."

