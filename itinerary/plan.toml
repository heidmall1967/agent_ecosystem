  "A client has 200k PDFs full of tables. Which chunking problems do you expect and what do you test first?",
  "When is fixed-size chunking actually good enough?",
]
[[week.quiz]]
q = "Main benefit of chunking on structural boundaries rather than fixed windows:"
options = ["Fewer chunks overall", "Retrieved chunks are self-contained units (a function, a section)", "Faster embedding", "Required by BM25"]
answer = 1
why = "Fixed windows cut definitions in half; the model then sees a fragment without the context that makes it answerable."
[[week.quiz]]
q = "Why prepend breadcrumbs ('Path 1 > Level 2 > Deliverable') to a chunk?"
options = ["It compresses the chunk", "It adds context terms the chunk lacks, helping both matching and grounding", "BM25 ignores it anyway", "It sorts chunks alphabetically"]
answer = 1
why = "A section body often never repeats its own heading; breadcrumbs put those terms back in."
[[week.quiz]]
q = "In BM25, parameter b controls:"
options = ["Term-frequency saturation", "Document-length normalization", "IDF smoothing", "How many results are returned"]
answer = 1
why = "b in [0,1] scales how much long documents are penalized; k1 controls how fast repeated terms saturate."
[[week.quiz]]
q = "With num_ctx 2048 and top-5 retrieval, a sensible chunk cap is roughly:"
options = ["2000 tokens", "~300 tokens", "50 tokens", "No cap: Ollama extends context automatically"]
answer = 1
why = "5 x 300 = 1500, leaving room for instructions, question and answer. Ollama does not extend context; it truncates the prompt (warning only in the server log)."

